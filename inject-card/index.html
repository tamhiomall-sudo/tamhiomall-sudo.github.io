/* tools-reference.css: the shared foundation for Warehouse/My Tools.

   NOT linked by any tool, and must not be. Linking was tried 2026-09-16 to
   2026-09-24 and reversed: a linked tool loses every colour the moment it is
   opened away from this folder. build-standard.md, "Shared CSS, settled".

   This is the copy to paste. A new tool starts by pasting this block into its
   own <style>, first, before the tool's own rules. A change here means
   pasting into each tool; tool-check.py flags a tool whose block has drifted.

   [data-theme="light"], or by the computer's own setting when no choice has
   been made (:root:not([data-theme])). The older names (--bg --card --line
   --field --text --dim --accent --good --warn --bad) are kept so a tool that

   Also needed in each tool's <head>, before the stylesheet:
     <meta name="theme-color" content="#16191d">
     <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")
       document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
   and the Appearance switch (see dashboard.html) where the tool has a toolbar.

:root {

*, *::before, *::after { box-sizing:border-box; }

body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}

a { color:var(--accent); }
button, input, select, textarea { font-family:inherit; }
::selection { background:var(--accent); color:var(--on-gold); }

/* Focus: never remove an outline without replacing it. */
:focus-visible { outline:2px solid var(--gold-hi); outline-offset:3px; }

/* Native controls follow the theme (scrollbars, date pickers, dropdowns). */
select { background-color:var(--field); color:var(--text); border:1px solid var(--control); }

/* Headings in Timeburner: regular for the page title, bold for section and panel titles. */
h1, h2, h3 { font-family:var(--display); }
h1 { font-weight:400; letter-spacing:-.01em; }
h2, h3 { font-weight:700; letter-spacing:0; }

/* ---- Buttons. One primary per view, and it carries the gold. ---------- */
.btn, button.btn, a.btn {
  appearance:none; border:0; cursor:pointer; font:500 14px/1 var(--sans);
  min-height:44px; padding:0 20px; border-radius:10px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  white-space:nowrap; text-decoration:none; color:var(--text);
  background:var(--btn2); box-shadow:var(--btn2-sh);
  transition-property:box-shadow,transform,filter,background-color,color;
  transition-duration:.16s; transition-timing-function:var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.btn.primary { background:var(--btn1); color:var(--btn1-ink); box-shadow:var(--btn1-sh); }
.btn.quiet { background:transparent; box-shadow:none; color:var(--dim); }
.btn.danger { color:var(--bad); }
.btn.sm { min-height:34px; padding:0 14px; font-size:13px; border-radius:8px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity:.45; cursor:not-allowed; filter:saturate(.4); }
.btn:not(:disabled):active { transform:scale(.96); }
@media (hover:hover) {
  .btn:not(:disabled):hover { filter:brightness(1.12); }
  .btn.primary:not(:disabled):hover { background:var(--btn1-h); color:var(--btn1-ink-h); box-shadow:var(--btn1-sh-h); filter:none; transform:translateY(-1px); }
  .btn.quiet:not(:disabled):hover { background:var(--tint-2); color:var(--text); filter:none; }
}

/* ---- Panels, fields, tags -------------------------------------------- */
.panel { background:var(--panel); box-shadow:var(--ring); border-radius:14px; padding:22px 24px;
  transition-property:box-shadow,transform; transition-duration:.2s; transition-timing-function:var(--ease); }
@media (hover:hover) { .panel.lift:hover { box-shadow:var(--ring-hi); transform:translateY(-2px); } }

.field, input.field, select.field, textarea.field {
  width:100%; min-height:44px; border:0; border-radius:10px; padding:0 14px;
  background:var(--field); color:var(--text); box-shadow:var(--inset); font:14px var(--sans);
}
textarea.field { padding:12px 14px; min-height:88px; }
.field:focus { outline:none; box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--halo),inset 0 1px 3px rgba(0,0,0,.35); }
.field::placeholder { color:var(--dim); }

.tag { display:inline-block; font-size:12px; font-weight:500; padding:2px 10px; border-radius:999px;
  color:var(--dim); background:var(--tint-2); }
.tag.good { color:var(--good); background:color-mix(in srgb,var(--good) 14%,transparent); }
.tag.warn { color:var(--warn); background:var(--warn-tint); }
.tag.bad  { color:var(--bad);  background:color-mix(in srgb,var(--bad) 14%,transparent); }

/* The Chain: a thread of waypoints. */
.chain { display:flex; }
.chain .node { flex:1; min-width:0; }
.chain .node .l { display:flex; align-items:center; }
.chain .node .dot { width:10px; height:10px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold-lo));
  box-shadow:0 0 0 4px var(--halo),0 2px 6px rgba(0,0,0,.4); }
.chain .node.off .dot { background:transparent; box-shadow:inset 0 0 0 1.5px var(--dim); }
.chain .node .thread { height:1px; flex:1; background:linear-gradient(to right,var(--accent),var(--line)); }
.chain .node:last-child .thread { display:none; }

/* Switching theme: no colour transition, or every surface smears. */
.no-tx, .no-tx * { transition:none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important; }
}

/* Print baseline: paper-safe whatever the theme. A tool with its own
   #printview (see bow-tie.html) overrides this. */
@media print {
  :root, :root[data-theme] { --bg:#fff; --card:#fff; --text:#1c1b18; --dim:#55534d; --line:#ccc; --accent:#8a6a2f; }
  body { background:#fff; color:#1c1b18; }
  .btn { box-shadow:0 0 0 1px #999; background:#fff; color:#1c1b18; }
}

/* Utilities. Opt in per element where the tool needs them. */
.truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tabular, .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.long-list { content-visibility:auto; }
</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exercise inject card</title>
<style>
/* =======================================================================
   Exercise inject card (2026-11-02; prototype 2026-10-31)

   The page a player's phone opens when they scan an inject card. The
   inject is not on any server: it travels inside the QR code itself, in
   the part of the address after '#', which a phone never sends to the
   web server. It is locked with a release word that the controller reads
   out when the inject is given, so a card scanned early shows nothing.

   What it refuses to do: send anything anywhere, keep the inject after
   the page is closed, or open without the word.

   Cards are made by exercise-cards.html from the exercise open in the
   Exercise Console. Plan: Working/shared-exercise-control-plan.md,
   "Added 2026-10-31", item 3 (release word fallback).
   ======================================================================= */
*,*::before,*::after{box-sizing:border-box;}
html{color-scheme:dark;}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.5 var(--sans);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button,input{font:inherit;}
button{min-height:48px;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}

.ex{background:var(--warn);color:var(--on-status);text-align:center;font-weight:700;
  letter-spacing:.12em;padding:8px 16px;font-size:14px;}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px;}
.k{font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600;margin:0 0 4px;}
h1{font-size:24px;line-height:1.25;margin:0 0 16px;font-weight:600;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:16px;}
label{display:block;font-size:14px;color:var(--dim);margin-bottom:6px;}
input{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:12px;font-size:20px;letter-spacing:.04em;}
input:focus{border-color:var(--accent);outline:none;}
.btn{width:100%;margin-top:12px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:var(--on-gold);font-weight:700;cursor:pointer;}
.btn.ghost{background:none;color:var(--text);border-color:var(--line);}
.btn:disabled{opacity:.55;cursor:default;}
.msg{min-height:24px;margin:10px 0 0;font-size:15px;}
.msg.bad{color:var(--bad);} .msg.good{color:var(--good);}
.text{font-size:19px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;}
.meta{color:var(--dim);font-size:14px;margin-top:14px;}
.foot{color:var(--dim);font-size:13px;margin-top:24px;border-top:1px solid var(--line);padding-top:12px;}
.hide{display:none;}
/* Arabic: the second line in a two-language page, and no letter-spacing,
   which pulls joined Arabic letters apart. */
.ar2{display:block;margin-top:3px;}
.arabic,.arabic *,:lang(ar){letter-spacing:0!important;}
</style>
<style id="house-extra">
h1{font-family:var(--display);font-weight:400;letter-spacing:-.01em;}
h2,h3{font-family:var(--display);font-weight:700;letter-spacing:0;}
.btn,button.primary,button.ghost{border:0;border-radius:10px;font-family:var(--sans);font-weight:500;
  background:var(--btn2);color:var(--text);box-shadow:var(--btn2-sh);
  transition-property:box-shadow,transform,filter,color;transition-duration:.16s;transition-timing-function:var(--ease);}
.btn.primary,.btn.gold,button.primary,button.go{background:var(--btn1);color:var(--btn1-ink);box-shadow:var(--btn1-sh);}
@media (hover:hover){
  .btn:not(:disabled):hover,button.ghost:not(:disabled):hover{filter:brightness(1.12);color:var(--text);border-color:transparent;}
  .btn.primary:not(:disabled):hover,.btn.gold:not(:disabled):hover,button.primary:not(:disabled):hover,button.go:not(:disabled):hover{background:var(--btn1-h);box-shadow:var(--btn1-sh-h);filter:none;color:var(--btn1-ink-h);transform:translateY(-1px);}
}
.btn:not(:disabled):active,button.primary:not(:disabled):active,button.ghost:not(:disabled):active{transform:scale(.96);}
.btn:disabled{opacity:.45;filter:saturate(.4);}
.panel{border:0;background:var(--panel);box-shadow:var(--ring);border-radius:14px;}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),select,textarea{
  border-color:transparent;box-shadow:var(--inset);background-color:var(--field);color:var(--text);border-radius:9px;}
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]):focus,select:focus,textarea:focus{
  outline:none;border-color:transparent;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--halo);}
.tabular{font-family:var(--mono);}
</style>
<style id="house-public">
/* This page goes on a public https address for players' phones, so it carries no
   Timeburner (its licence forbids redistributing the font). Headings use Geist,
   which is free to share (OFL). Decided 2026-11-04. */
:root[lang]{--display:var(--sans);}
</style>
</head>
<body>
<div class="ex" id="ex" aria-hidden="true">EXERCISE · EXERCISE · EXERCISE</div>
<main>
  <p class="k" id="who" dir="auto">Inject card</p>
  <h1 id="head" dir="auto">Wait for the controller</h1>

  <div class="panel" id="lock">
    <p style="margin:0 0 14px" id="intro">This card holds an exercise inject. It opens when the controller gives you the release word.</p>
    <label for="word" id="wordLabel">Release word</label>
    <input id="word" dir="ltr" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" placeholder="For example: falcon 42">
    <button class="btn" id="open">Open the inject</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>

  <div class="panel hide" id="shown">
    <p class="text" id="text" dir="auto"></p>
    <p class="meta" id="when"></p>
    <button class="btn ghost" id="got">Received</button>
    <p class="msg good" id="gotMsg" role="status" aria-live="polite"></p>
  </div>

  <p class="foot" id="foot">Exercise only. In a real emergency, stop and follow the site's emergency procedures. Nothing on this page is sent anywhere.</p>
</main>

<script>
/* ---- what the card carries -------------------------------------------------
   #v1.<label>.<salt>.<iv>.<sealed>, each part base64url. The label (card number
   and where) is in the clear so the player knows which card they hold; it says
   nothing about the inject. Everything else is AES-GCM, keyed from the release
   word with PBKDF2. Inside, the first byte says whether the text was deflated
   to fit a smaller QR code. */
const $ = id => document.getElementById(id);
const ITER = 150000;

const b64u = s => {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
};
/* The word as spoken, not as typed: case, spaces and hyphens do not matter. */
const norm = w => String(w || '').toLowerCase().replace(/[\s\-_.]+/g, '');

/* ---- the page's own wording, English and Arabic -----------------------------
   A card may carry a language straight after 'v1': 'ar' or 'both'. Without one
   it is English, so cards made before Arabic was added still open. It sits at
   the front so a scan cut short still says which language to complain in.
   The Arabic wording wants checking by a native speaker before the day. */
const TX = {
  banner:   ['EXERCISE · EXERCISE · EXERCISE', 'تمرين · تمرين · تمرين', 'EXERCISE · تمرين'],
  kind:     ['Inject card', 'بطاقة مُدخَل تمرين'],
  wait:     ['Wait for the controller', 'انتظر مسؤول التحكم'],
  intro:    ['This card holds an exercise inject. It opens when the controller gives you the release word.',
             'تحتوي هذه البطاقة على مُدخَل تمرين. تُفتح عندما يعطيك مسؤول التحكم كلمة الفتح.'],
  wordLabel:['Release word', 'كلمة الفتح'],
  example:  ['For example: falcon 42', 'مثال: falcon 42', 'falcon 42'],
  open:     ['Open the inject', 'افتح المُدخَل'],
  got:      ['Received', 'تم الاستلام'],
  foot:     ['Exercise only. In a real emergency, stop and follow the site\'s emergency procedures. Nothing on this page is sent anywhere.',
             'للتمرين فقط. في حالة طوارئ حقيقية، توقّف واتبع إجراءات الطوارئ المعتمدة في الموقع. لا يُرسَل أي شيء من هذه الصفحة.'],
  badHead:  ['This card did not come through', 'لم تصل هذه البطاقة كاملة'],
  badBody:  ['The address is incomplete. Scan the card again, holding the phone steady. If it still fails, ask the controller for the printed inject.',
             'العنوان غير مكتمل. امسح البطاقة مرة أخرى مع تثبيت الهاتف. إذا تكرر الخطأ، اطلب المُدخَل المطبوع من مسؤول التحكم.'],
  noCrypto: ['This browser cannot open the card. Try the phone\'s own browser, or ask the controller.',
             'لا يستطيع هذا المتصفح فتح البطاقة. جرّب متصفح الهاتف الأساسي، أو اسأل مسؤول التحكم.'],
  empty:    ['Type the release word first.', 'اكتب كلمة الفتح أولاً.'],
  opening:  ['Opening...', 'جارٍ الفتح...'],
  wrong:    ['That word does not open this card. Check it with the controller.',
             'هذه الكلمة لا تفتح هذه البطاقة. تحقّق منها مع مسؤول التحكم.'],
  inject:   ['Inject', 'مُدخَل'],
  opened:   ['Opened at {t}', 'فُتحت الساعة {t}'],
  gotMsg:   ['Received at {t}. Tell the controller.', 'تم الاستلام الساعة {t}. أبلغ مسؤول التحكم.']
};
let LANG = 'en';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tx(k, t){
  const [en, ar, both] = TX[k], f = s => esc(s).replace('{t}', t || '');
  if (LANG === 'ar') return f(ar);
  if (LANG === 'both') return both ? f(both) : f(en) + '<span class="ar2" lang="ar" dir="rtl">' + f(ar) + '</span>';
  return f(en);
}
const plain = k => LANG === 'ar' ? TX[k][1] : LANG === 'both' ? (TX[k][2] || TX[k][0]) : TX[k][0];
const put = (id, k, t) => { $(id).innerHTML = tx(k, t); };

function setLang(l){
  LANG = l;
  if (l === 'ar'){ document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
  put('ex', 'banner'); put('head', 'wait'); put('intro', 'intro'); put('wordLabel', 'wordLabel');
  put('open', 'open'); put('got', 'got'); put('foot', 'foot');
  $('who').innerHTML = tx('kind'); $('word').placeholder = plain('example');
  document.title = l === 'ar' ? TX.kind[1] : 'Exercise inject card';
  if (l !== 'en') $('ex').classList.add('arabic');
}

function readCard(){
  const h = location.hash.slice(1).split('.');
  if (h[1] === 'ar' || h[1] === 'both') setLang(h.splice(1, 1)[0]);
  if (h[0] !== 'v1' || h.length !== 5) return null;
  try {
    return { label: new TextDecoder().decode(b64u(h[1])), salt: b64u(h[2]), iv: b64u(h[3]), sealed: b64u(h[4]) };
  } catch(e){ return null; }
}

async function inflate(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function unlock(card, word){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(word)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:card.salt, iterations:ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:card.iv }, key, card.sealed));
  const body = plain[0] === 1 ? await inflate(plain.slice(1)) : plain.slice(1);
  return JSON.parse(new TextDecoder().decode(body));
}

const clock = d => d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

function start(){
  const card = readCard();
  if (!card){
    put('head', 'badHead');
    $('lock').innerHTML = '<p style="margin:0">' + tx('badBody') + '</p>';
    return;
  }
  $('who').textContent = card.label;
  if (/[؀-ۿ]/.test(card.label)) $('who').classList.add('arabic');
  if (!window.crypto || !crypto.subtle){
    $('msg').className = 'msg bad';
    put('msg', 'noCrypto');
    $('open').disabled = true; return;
  }
  let busy = false;
  async function go(){
    if (busy) return;
    const w = $('word').value;
    if (!norm(w)){ $('msg').className = 'msg bad'; put('msg', 'empty'); return; }
    busy = true; $('open').disabled = true; $('msg').className = 'msg'; put('msg', 'opening');
    try {
      const inj = await unlock(card, w);
      const now = new Date();
      if (inj.t) $('head').textContent = inj.t; else put('head', 'inject');
      $('text').textContent = inj.x || '';
      put('when', 'opened', clock(now));
      $('lock').classList.add('hide'); $('shown').classList.remove('hide');
      $('got').focus();
    } catch(e){
      /* A wrong word and a damaged card look the same from here; say so plainly.
         The pause makes guessing slower without bothering someone who misheard. */
      await new Promise(r => setTimeout(r, 1500));
      $('msg').className = 'msg bad';
      put('msg', 'wrong');
      $('open').disabled = false; $('word').select();
    }
    busy = false;
  }
  $('open').onclick = go;
  $('word').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('got').onclick = () => {
    $('got').disabled = true;
    put('gotMsg', 'gotMsg', clock(new Date()));
  };
  $('word').focus();
}
/* A second card scanned into the same tab changes only the part after '#', which
   does not reload the page, so the last card's inject would stay on screen. */
window.addEventListener('hashchange', () => location.reload());
start();
</script>
<script id="house-theme-follow">
addEventListener('storage',function(e){if(e.key!=='theme')return;var r=document.documentElement;
r.classList.add('no-tx');if(e.newValue==='light'||e.newValue==='dark')r.setAttribute('data-theme',e.newValue);
else r.removeAttribute('data-theme');requestAnimationFrame(function(){r.classList.remove('no-tx');});});
</script>
</body>
